name: RichAPI
image: https://richapi.ai/opengraph-image
description: RichAPI provides a B2B data enrichment platform and Managed Customer Platform (MCP) that aggregates over 65 GTM data endpoints across
  categories such as company enrichment, contact finding, social signals, and webscraping. With a single API key and credit pool, developers can
  integrate live contact, company, and signal data into applications, CRMs, and AI assistants. The service offers a free tier with 25 credits,
  flexible pricing, and extensive documentation for quick onboarding.
